name: AEOS validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate ontology
        run: aeos validate --format json
      - name: Verify generated export
        run: aeos build --check
      - name: Run tests
        run: pytest
      - name: Run lint
        run: ruff check src tests scripts

  release-checks:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: python -m pip install -e .
      - name: Install artifact validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils qpdf
      - name: Run release checks
        run: python scripts/check_release.py
