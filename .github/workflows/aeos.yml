name: AEOS validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every step below runs one `./run.sh` arm. The arm owns its command, the
# lockfile, and the interpreter, so this file never repeats a gate command and
# no job installs a package set that another job already installed.

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python with uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.14"
      - name: Gate
        run: ./run.sh gate

  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python with uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.11"
      - name: Compatibility slice
        run: ./run.sh compat

  release-checks:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python with uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.14"
      - name: Install artifact validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils qpdf
      - name: Release checks
        run: ./run.sh release

  # GNN pin: .github/gnn-pin.json (v5.0.3, 8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1)
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python with uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.12"
      - name: Pinned GNN conformance
        run: ./run.sh gnn-parser
