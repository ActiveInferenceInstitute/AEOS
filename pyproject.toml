[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeos"
version = "1.0.0"
description = "Portable, validated Active Entity Ontology for Science data and tooling"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Active Inference Institute"}]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.17,<1"]

[project.scripts]
aeos = "aeos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-fail-under=90"
